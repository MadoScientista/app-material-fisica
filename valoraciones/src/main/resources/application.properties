spring.application.name=valoraciones

# Oracle Autonomous Database
# spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_ALIAS}?TNS_ADMIN=${WALLET_PATH}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Conexión a MySql
spring.datasource.url=jdbc:mysql://localhost:3306/valoraciones_db?createDatabaseIfNotExist=true
spring.datasource.username=admin_valoraciones_db
spring.datasource.password=1234

# Puertos de los microservicios
# Ejercicios generados
# server.port=8081  

# Historial
# server.port=8082

# Logros
# server.port=8083

# Material
# server.port=8084

# Notificador
# server.port=8085

# Suscripciones
# server.port=8086

# Usuarios
# server.port=8087

# Valoraciones
server.port=8088


# Configuración de JPA y Hibernate
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# LOGGING (SLF4J + Logback) 
logging.level.root=INFO 
logging.level.com.madoscientista.valoraciones=DEBUG 

# Para ver las consultas SQL en el log: 
logging.level.org.hibernate.SQL=DEBUG

# Opción A: Solo el nombre del archivo (se crea en la ra�z del proyecto) 
logging.file.name=mi-log-aplicacion.log
